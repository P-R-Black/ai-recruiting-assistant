[project]
name = "ai-recruiting-assistant"
version = "0.1.0"
description = "An AI-powered recruiting assistant built with FastAPI, React, and PostgreSQL."
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "python-dotenv",
    "msal>=1.37.0",
    "requests>=2.34.2",
    "alembic>=1.19.0",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.ruff]
line-length = 100
exclude = ["alembic/versions", ".venv", "venv", "__pycache__", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
