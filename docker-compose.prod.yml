services:
  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: production
    env_file:
      - ./backend/.env.production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./backend/.tokens:/app/.tokens

  db:
    restart: unless-stopped
    image: postgres:16
    container_name: ai-recruiting-db
    environment:
      POSTGRES_USER: ai_recruiting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_recruiting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_recruiting -d ai_recruiting"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
