services:
  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: production
    env_file:
      - ./backend/.env.production
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: ai-recruiting-db
    environment:
      POSTGRES_USER: ai_recruiting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_recruiting
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: